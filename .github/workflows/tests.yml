name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest on Hermes 0.23.3
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the plugin
        uses: actions/checkout@v4

      # The tests import Hermes' real goal storage, so CI needs a Hermes
      # checkout. Pinned to a release this plugin is tested against. When
      # bumping this, run the suite locally first and update the README's
      # compatibility section if the private imports moved.
      - name: Check out Hermes
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: v0.23.3
          path: .hermes-src

      # Hermes ships a uv lockfile; installing from it gives the same
      # dependency set Hermes itself runs with (plain pip resolves a
      # different, incomplete set).
      - name: Set up uv
        uses: astral-sh/setup-uv@v10

      - name: Install Hermes from its lockfile
        working-directory: .hermes-src
        run: |
          uv sync --frozen --python 3.14
          uv pip install --python .venv/bin/python pytest

      - name: Run the tests
        env:
          PYTHONPATH: ${{ github.workspace }}/.hermes-src
        run: .hermes-src/.venv/bin/python -m pytest tests/ -q

      - name: Validate the plugin manifest
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          .hermes-src/.venv/bin/hermes plugins validate .
          .hermes-src/.venv/bin/hermes plugins doctor . --ci
