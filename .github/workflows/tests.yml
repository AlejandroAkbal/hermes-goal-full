name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest on Hermes 0.23.3
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the plugin
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The tests import Hermes' real goal storage, so CI needs a Hermes
      # checkout. Pinned to a release this plugin is tested against. When
      # bumping this, run the suite locally first and update the README's
      # compatibility section if the private imports moved.
      - name: Check out Hermes
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: v0.23.3
          path: .hermes-src

      - name: Install Hermes and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e ./.hermes-src
          pip install pytest ruamel.yaml python-dotenv

      - name: Run the tests
        env:
          PYTHONPATH: ${{ github.workspace }}/.hermes-src
        run: pytest tests/ -q

      - name: Validate the plugin manifest
        run: |
          hermes plugins validate .
          hermes plugins doctor . --ci
