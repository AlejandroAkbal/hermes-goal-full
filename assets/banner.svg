<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">goal-full</title>
  <desc id="desc">Set the whole goal from one sentence, then keep the agent working until the finish line is met.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#101a33"/>
      <stop offset="1" stop-color="#0a1526"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.55"/>
    </pattern>
    <pattern id="checker" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#0f172a"/>
      <rect width="14" height="14" fill="#e2e8f0" opacity="0.9"/>
      <rect x="14" y="14" width="14" height="14" fill="#e2e8f0" opacity="0.9"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <g opacity="0.55">
    <circle cx="1040" cy="70" r="120" fill="#1d4ed8" opacity="0.18"/>
    <circle cx="1110" cy="250" r="90" fill="#7c3aed" opacity="0.16"/>
  </g>

  <g transform="translate(84 74)">
    <rect x="0" y="0" width="46" height="46" rx="12" fill="#0b1224" stroke="url(#accent)" stroke-width="2"/>
    <path d="M14 23.5 l6.5 6.5 L32 16.5" fill="none" stroke="url(#accent)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="150" y="108" font-family="'SF Mono','JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="58" font-weight="700" fill="url(#accent)" filter="url(#glow)">goal-full</text>

  <text x="84" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" font-weight="600" fill="#e6edf7">Set the whole goal from one sentence.</text>
  <text x="84" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#9fb0c9">Then keep the agent working until the finish line is met.</text>

  <g font-family="'SF Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="15">
    <g transform="translate(84 240)">
      <rect width="126" height="30" rx="15" fill="#0f1b31" stroke="#274263"/>
      <text x="63" y="20" text-anchor="middle" fill="#7dd3fc">contract</text>
    </g>
    <g transform="translate(222 240)">
      <rect width="126" height="30" rx="15" fill="#0f1b31" stroke="#274263"/>
      <text x="63" y="20" text-anchor="middle" fill="#7dd3fc">subgoals</text>
    </g>
    <g transform="translate(360 240)">
      <rect width="94" height="30" rx="15" fill="#0f1b31" stroke="#274263"/>
      <text x="47" y="20" text-anchor="middle" fill="#7dd3fc">gates</text>
    </g>
    <g transform="translate(466 240)">
      <rect width="132" height="30" rx="15" fill="#0f1b31" stroke="#274263"/>
      <text x="66" y="20" text-anchor="middle" fill="#7dd3fc">judge loop</text>
    </g>
  </g>

  <g transform="translate(860 60)">
    <rect x="0" y="0" width="28" height="200" fill="url(#checker)" rx="4"/>
    <rect x="44" y="0" width="28" height="200" fill="url(#checker)" rx="4" opacity="0.75"/>
    <rect x="88" y="0" width="28" height="200" fill="url(#checker)" rx="4" opacity="0.5"/>
    <rect x="132" y="0" width="28" height="200" fill="url(#checker)" rx="4" opacity="0.28"/>
    <rect x="176" y="0" width="28" height="200" fill="url(#checker)" rx="4" opacity="0.14"/>
    <rect x="-20" y="96" width="240" height="6" rx="3" fill="url(#fade)"/>
  </g>
</svg>
